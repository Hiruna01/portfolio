<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiruna Dilmith: Latent Space prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C1019;
    --surface: #131926;
    --line: #232B3B;
    --text: #E6EAF2;
    --dim: #7D889C;
    --faint: #465066;
    --glow: #A9BEFF;
    --sans: "Hanken Grotesk", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --panel-w: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  [hidden] { display: none !important; }

  .app { position: relative; height: 100dvh; }

  /* chrome */
  .id { position: absolute; left: 32px; top: 28px; z-index: 5; max-width: 300px; }
  .id h1 { font-weight: 500; font-size: 17px; margin: 0 0 4px; letter-spacing: -0.005em; }
  .id p { margin: 0; color: var(--dim); font-size: 14px; }
  .tools { position: absolute; right: 32px; top: 26px; z-index: 6; display: flex; gap: 12px; align-items: center; }
  .tools { transition: right .45s cubic-bezier(.2,.7,.2,1); }
  .panel-open .tools { right: calc(var(--panel-w) + 24px); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px); }
  .seg button { padding: 5px 13px; border-radius: 999px; font-size: 13.5px; color: var(--dim); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }

  /* map */
  .map { position: absolute; inset: 0; transition: right .45s cubic-bezier(.2,.7,.2,1); }
  .panel-open .map { right: var(--panel-w); }
  .map::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1.2px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 52%, #000 0%, transparent 100%);
            mask-image: radial-gradient(ellipse 60% 55% at 50% 52%, #000 0%, transparent 100%);
    opacity: .7;
  }
  .field { position: absolute; inset: 104px 6% 132px 6%; }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .wires line { stroke: var(--glow); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; animation: wire .6s ease-out forwards; }
  @keyframes wire { to { opacity: .5; } }

  .cl { position: absolute; transform: translate(-50%, -50%); color: var(--faint); font-size: 12.5px; white-space: nowrap; pointer-events: none; transition: opacity .3s; }
  .pt {
    position: absolute; transform: translate(-50%, -50%);
    width: 30px; height: 30px; display: grid; place-items: center;
    transition: opacity .35s;
    animation: arrive .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes arrive { from { opacity: 0; scale: .2; } to { opacity: 1; scale: 1; } }
  .drift { display: grid; place-items: center; animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { translate: -3px 2px; } to { translate: 3px -3px; } }
  .querying .drift { animation-play-state: paused; }
  .dot { display: block; transition: transform .25s, box-shadow .3s, background .3s, border-color .3s; }
  .pt[data-type="project"] .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--text); }
  .pt[data-type="article"] .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--dim); }
  .pt[data-type="content"] .dot { width: 7px; height: 7px; background: var(--dim); transform: rotate(45deg); }
  .pt[data-type="about"] .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--glow); }
  .lb {
    position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-size: 13px; color: var(--dim);
    opacity: 0; transition: opacity .25s, color .25s; pointer-events: none;
  }
  .pt[data-type="project"] .lb, .pt[data-type="about"] .lb { opacity: 1; }
  .pt.flip .lb { left: auto; right: 26px; }
  .pt:hover .lb, .pt:focus-visible .lb, .pt.lit .lb, .pt.sel .lb { opacity: 1; color: var(--text); }
  .pt:hover .dot, .pt:focus-visible .dot { transform: scale(1.5); }
  .pt[data-type="content"]:hover .dot, .pt[data-type="content"]:focus-visible .dot { transform: rotate(45deg) scale(1.5); }
  .pt:hover, .pt:focus-visible, .pt.lit, .pt.sel { z-index: 3; }
  .pt.sel .dot, .pt.lit .dot { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 0 5px color-mix(in srgb, var(--glow) 18%, transparent), 0 0 22px var(--glow); }
  .pt.off { opacity: .1; pointer-events: none; }
  .querying .pt:not(.lit) { opacity: .22; }
  .querying .cl { opacity: .4; }
  .qnode { position: absolute; transform: translate(-50%, -50%); width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--glow); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--glow) 55%, transparent); } to { box-shadow: 0 0 0 16px transparent; } }

  .legend { position: absolute; left: 32px; bottom: 34px; z-index: 4; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--dim); }
  .legend span { display: flex; align-items: center; gap: 10px; }
  .legend i { display: inline-block; flex: none; }
  .k-p { width: 9px; height: 9px; border-radius: 50%; background: var(--text); }
  .k-a { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); }
  .k-c { width: 6px; height: 6px; background: var(--dim); transform: rotate(45deg); margin: 0 1.5px; }

  /* ask bar */
  .askbar { position: absolute; left: 50%; bottom: 30px; z-index: 7; transform: translateX(-50%); width: min(540px, calc(100% - 48px)); transition: left .45s cubic-bezier(.2,.7,.2,1); }
  .panel-open .askbar { left: calc((100% - var(--panel-w)) / 2); }
  .askbar form {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px 6px 6px 18px; box-shadow: 0 18px 50px -20px #000;
  }
  .askbar form:focus-within { border-color: color-mix(in srgb, var(--glow) 60%, var(--line)); }
  .askbar input { flex: 1; min-width: 0; font: inherit; font-size: 15.5px; color: var(--text); background: none; border: 0; outline: 0; padding: 8px 0; }
  .askbar input::placeholder { color: var(--dim); }
  .askbar .go { background: var(--text); color: var(--bg); border-radius: 9px; padding: 7px 15px; font-size: 14px; font-weight: 500; }
  .askbar .go:hover { background: var(--glow); }
  .hints { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .hints button { font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: color-mix(in srgb, var(--bg) 80%, transparent); }
  .hints button:hover { color: var(--text); border-color: var(--faint); }

  /* panel */
  .panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: var(--panel-w); z-index: 8;
    background: var(--surface); border-left: 1px solid var(--line);
    padding: 84px 30px 30px; overflow-y: auto;
    transform: translateX(100%); transition: transform .45s cubic-bezier(.2,.7,.2,1); visibility: hidden;
  }
  .panel-open .panel { transform: none; visibility: visible; }
  .close { position: absolute; right: 22px; top: 26px; color: var(--dim); font-size: 13.5px; padding: 4px 8px; }
  .close:hover { color: var(--text); }
  .panel h2 { font-weight: 500; font-size: 25px; line-height: 1.2; letter-spacing: -0.015em; margin: 8px 0 12px; }
  .panel p { margin: 0 0 16px; color: #C3CADb; }
  .panel h3 { font-weight: 400; font-size: 12.5px; color: var(--dim); margin: 26px 0 8px; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .stack span { font-family: var(--mono); font-size: 11.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; }
  .plinks { display: flex; gap: 18px; font-size: 14px; }
  .plinks a { text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .plinks a:hover { text-decoration-color: var(--glow); }
  .near { list-style: none; margin: 0; padding: 0; }
  .near button { display: flex; width: 100%; justify-content: space-between; gap: 14px; text-align: left; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .near button:hover { color: var(--glow); }
  .near .mono { flex: none; }
  .q { font-size: 19px; font-weight: 500; line-height: 1.3; margin: 8px 0 16px; letter-spacing: -0.01em; }
  .trace { list-style: none; margin: 0 0 18px; padding: 0; font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .trace li { padding: 2px 0; display: flex; gap: 9px; }
  .trace li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; border: 1px solid var(--faint); }
  .trace li.done::before { background: var(--glow); border-color: var(--glow); }

  /* list view */
  .listview { position: absolute; inset: 0; overflow-y: auto; padding: 120px 32px 170px; transition: right .45s; }
  .panel-open .listview { right: var(--panel-w); }
  .listview section { max-width: 620px; margin: 0 auto 44px; }
  .listview h2 { font-weight: 400; font-size: 13px; color: var(--dim); margin: 0 0 6px; }
  .listview button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 18px; width: 100%; text-align: left; padding: 14px 0; border-top: 1px solid var(--line); }
  .listview button:hover b { color: var(--glow); }
  .listview b { font-weight: 500; font-size: 16px; }
  .listview small { grid-column: 1; font-size: 14px; color: var(--dim); }
  .listview .mono { grid-row: 1; grid-column: 2; align-self: center; }

  @media (max-width: 1180px) { .panel-open .id p { display: none; } }
  @media (max-width: 820px) {
    :root { --panel-w: 100%; }
    .id { left: 20px; top: 18px; }
    .id p { display: none; }
    .tools { right: 14px; top: 54px; left: 14px; justify-content: space-between; }
    .seg button { padding: 5px 9px; font-size: 12.5px; }
    .legend, .hints { display: none; }
    .field { inset: 120px 12% 110px 8%; }
    .panel-open .map, .panel-open .listview { right: 0; }
    .panel-open .tools { right: 14px; }
    .panel-open .askbar { left: 50%; }
    .panel { top: auto; height: 62dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 54px 22px 110px; transform: translateY(100%); }
    .close { top: 14px; right: 14px; }
    .askbar { bottom: 16px; }
    .listview { padding: 112px 20px 120px; }
    .pt[data-type="about"] .lb { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .wires line { opacity: .5; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="id">
    <h1>Hiruna Dilmith</h1>
    <p>AI engineer. This is a map of what I've built, written and shared. Things that sit close together are about the same idea.</p>
  </header>

  <div class="tools">
    <div class="seg" id="filters" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="project" aria-pressed="false">Projects</button>
      <button data-f="article" aria-pressed="false">Articles</button>
      <button data-f="content" aria-pressed="false">Content</button>
      <button data-f="about" aria-pressed="false">About</button>
    </div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-v="map" aria-pressed="true">Map</button>
      <button data-v="list" aria-pressed="false">List</button>
    </div>
  </div>

  <div class="map" id="map">
    <div class="field" id="field">
      <svg class="wires" id="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="listview" id="listview" hidden></div>

  <div class="legend" id="legend" aria-hidden="true">
    <span><i class="k-p"></i>Project</span>
    <span><i class="k-a"></i>Article</span>
    <span><i class="k-c"></i>Video, talk or post</span>
  </div>

  <div class="askbar">
    <div class="hints" id="hints"></div>
    <form id="ask">
      <input id="q" type="text" autocomplete="off" placeholder="Ask me something. I'll show you where the answer lives." aria-label="Your question">
      <button class="go" type="submit">Ask</button>
    </form>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="close" id="close">Close</button>
    <div id="panel-body"></div>
  </aside>
</div>

<script>
const clusters = {
  agents:    { name: "Agents", x: 24, y: 30 },
  retrieval: { name: "Retrieval", x: 70, y: 24 },
  evals:     { name: "Evaluation", x: 76, y: 70 },
  models:    { name: "Models and voice", x: 24, y: 76 },
  me:        { name: "", x: 50, y: 50 },
};
const items = [
  { id: "atlas", type: "project", c: "agents", dx: 0, dy: 2, title: "Atlas", desc: "A research agent that plans, searches and writes cited briefs. It refuses to write a claim it cannot cite.", stack: ["Python", "Claude", "LangGraph", "Postgres"], tags: "agent agents agentic planning research tools search" },
  { id: "agent-loop", type: "article", c: "agents", dx: 9, dy: -11, title: "What an agent loop actually does", desc: "A plain walk through one turn of an agent: what the model sees, what it decides, and where things go wrong.", meta: "Article, 9 min", tags: "agent agents loop tools planning" },
  { id: "tool-design", type: "article", c: "agents", dx: 12, dy: 9, title: "Designing tools an agent can use well", desc: "Why tool names, arguments and error messages matter more than the system prompt.", meta: "Article, 10 min", tags: "agent agents tools design api" },
  { id: "agent-fail", type: "content", c: "agents", dx: -11, dy: 12, kind: "Thread", title: "Seven ways agents fail in production", desc: "A thread on the failures I see most, with the fix I reach for first.", meta: "Thread on X", tags: "agent agents failure production" },
  { id: "context", type: "article", c: "agents", dx: -10, dy: -9, title: "Notes on context engineering", desc: "What to put in the window, what to leave out, and how to tell the difference.", meta: "Article, 8 min", tags: "context prompt prompts memory agents" },

  { id: "recall", type: "project", c: "retrieval", dx: 0, dy: 2, title: "Recall", desc: "Hybrid retrieval over personal notes, with answers that link back to the exact source line.", stack: ["TypeScript", "pgvector", "BM25", "Next.js"], tags: "rag retrieval search embeddings vector notes chunking rerank" },
  { id: "chunking", type: "article", c: "retrieval", dx: 10, dy: 11, title: "Chunking is a retrieval decision, not preprocessing", desc: "Chunk boundaries decide what can be found. Treat them as part of the retriever.", meta: "Article, 12 min", tags: "rag retrieval chunking embeddings search" },
  { id: "rag-video", type: "content", c: "retrieval", dx: -11, dy: 10, kind: "Video", title: "Build a retrieval pipeline in 20 minutes", desc: "A start-to-finish build, including the evaluation step most tutorials skip.", meta: "Video on YouTube", tags: "rag retrieval video tutorial embeddings" },
  { id: "embed-short", type: "content", c: "retrieval", dx: 8, dy: -10, kind: "Short", title: "Embeddings explained in 60 seconds", desc: "The shortest honest explanation I could manage.", meta: "Short on YouTube", tags: "embeddings vector retrieval explain" },

  { id: "evalkit", type: "project", c: "evals", dx: 2, dy: 0, title: "Evalkit", desc: "A small harness for running LLM evals in CI. It fails the build when a score drops beyond its noise band.", stack: ["Python", "pytest", "DuckDB"], tags: "eval evals evaluation testing ci metrics quality regression" },
  { id: "promptdiff", type: "project", c: "evals", dx: -13, dy: -9, title: "Promptdiff", desc: "Shows what changed in model behaviour when a prompt changes, before it reaches users.", stack: ["Go", "SQLite", "React"], tags: "prompt prompts regression testing diff evals review" },
  { id: "evals-first", type: "article", c: "evals", dx: 10, dy: -11, title: "Write the evals before the prompt", desc: "If you can't say what good looks like, no prompt will get you there.", meta: "Article, 7 min", tags: "eval evals evaluation prompt testing" },
  { id: "ship-talk", type: "content", c: "evals", dx: -7, dy: 12, kind: "Talk", title: "Shipping LLM features without guessing", desc: "A meetup talk on getting from a demo to something you can put your name on.", meta: "Talk, 25 min", tags: "evals evaluation shipping talk quality" },

  { id: "voiceline", type: "project", c: "models", dx: 0, dy: -2, title: "Voiceline", desc: "A realtime voice agent for booking calls, built to recover gracefully when the caller interrupts.", stack: ["Node", "WebRTC", "Whisper", "ElevenLabs"], tags: "voice realtime speech audio agent phone latency" },
  { id: "tinytuner", type: "project", c: "models", dx: 14, dy: 8, title: "Tiny-tuner", desc: "A one-command LoRA fine-tuning pipeline for small open models, with an eval report at the end.", stack: ["PyTorch", "PEFT", "Modal"], tags: "fine-tuning finetune lora training models open source small" },
  { id: "tune-live", type: "content", c: "models", dx: 6, dy: -13, kind: "Video", title: "Fine-tuning a small model, live", desc: "An unedited session: data prep, training, and the moment the eval disagrees with me.", meta: "Video on YouTube", tags: "fine-tuning lora training models video" },

  { id: "background", type: "about", c: "me", dx: -3, dy: -7, title: "Background", desc: "I started in backend engineering and moved to applied AI when language models became good enough to build products on. Most of my time now goes into agent loops, retrieval quality and evaluation.", tags: "background who about experience story yourself" },
  { id: "focus", type: "about", c: "me", dx: 5, dy: 1, title: "What I focus on", desc: "Systems you can reason about: small prompts, explicit tools, and numbers you can trust before you ship. I'm most useful on agentic features, retrieval that returns the wrong thing, and evals a team will keep running.", tags: "focus interests work approach" },
  { id: "contact", type: "about", c: "me", dx: -4, dy: 8, title: "Get in touch", desc: "Email is best: hello@yourdomain.com. I'm open to collaborations and usually reply within a couple of days.", tags: "contact email reach hire hiring available", links: ["GitHub", "LinkedIn", "X"] },
];
items.forEach(it => { it.x = clusters[it.c].x + it.dx; it.y = clusters[it.c].y + it.dy; });
const byId = Object.fromEntries(items.map(i => [i.id, i]));
const typeName = (it) => it.type === "content" ? it.kind : it.type[0].toUpperCase() + it.type.slice(1);

const $ = (s) => document.querySelector(s);
const app = $("#app"), field = $("#field"), wires = $("#wires"), body = $("#panel-body");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const esc = (s) => s.replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

/* build the map */
Object.values(clusters).forEach(c => {
  if (!c.name) return;
  const el = document.createElement("span"); el.className = "cl"; el.textContent = c.name;
  el.style.left = c.x + "%"; el.style.top = (c.y - 21) + "%"; field.append(el);
});
items.forEach((it, n) => {
  const b = document.createElement("button");
  b.className = "pt" + (it.x > 62 ? " flip" : ""); b.dataset.type = it.type; b.dataset.id = it.id;
  b.style.left = it.x + "%"; b.style.top = it.y + "%";
  b.style.animationDelay = (Math.hypot(it.x - 50, it.y - 50) * 14) + "ms";
  b.setAttribute("aria-label", typeName(it) + ": " + it.title);
  b.innerHTML = `<span class="drift" style="animation-delay:-${(n * 1.7) % 9}s; animation-duration:${8 + (n % 5)}s"><span class="dot"></span></span><span class="lb">${esc(it.title)}</span>`;
  b.addEventListener("click", () => { clearQuery(); showItem(it.id); });
  field.append(b);
});
const pt = (id) => field.querySelector(`.pt[data-id="${id}"]`);

/* list view */
$("#listview").innerHTML = [["project", "Projects"], ["article", "Articles"], ["content", "Content"], ["about", "About me"]].map(([t, name]) =>
  `<section data-type="${t}"><h2>${name}</h2>${items.filter(i => i.type === t).map(i =>
    `<button data-id="${i.id}"><b>${esc(i.title)}</b><span class="mono">${t === "project" ? clusters[i.c].name.toLowerCase() : t === "content" ? i.kind.toLowerCase() : ""}</span><small>${esc(i.desc)}</small></button>`).join("")}</section>`).join("");
$("#listview").addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if (b) { clearQuery(); showItem(b.dataset.id); } });

/* panel */
function openPanel() { app.classList.add("panel-open"); }
function closePanel() { app.classList.remove("panel-open"); clearQuery(); field.querySelectorAll(".sel").forEach(e => e.classList.remove("sel")); }
$("#close").addEventListener("click", closePanel);
addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePanel();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); }
});
function nearList(list) {
  return `<ul class="near">${list.map(n => `<li><button data-id="${n.id}"><span>${esc(n.title)}</span><span class="mono">${typeName(n).toLowerCase()}</span></button></li>`).join("")}</ul>`;
}
function showItem(id) {
  const it = byId[id];
  field.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  pt(id).classList.add("sel");
  const near = items.filter(o => o.c === it.c && o.id !== id);
  body.innerHTML = `
    <span class="mono">${it.type === "about" ? "about me" : typeName(it).toLowerCase() + " in " + clusters[it.c].name.toLowerCase()}</span>
    <h2>${esc(it.title)}</h2>
    <p>${esc(it.desc)}</p>
    ${it.stack ? `<div class="stack">${it.stack.map(s => `<span>${s}</span>`).join("")}</div>` : ""}
    <div class="plinks">${it.type === "project" ? `<a href="#">Read the case study</a><a href="#">Source on GitHub</a>`
      : it.links ? it.links.map(l => `<a href="#">${l}</a>`).join("")
      : it.type === "about" ? "" : `<a href="#">Open ${it.type === "article" ? "the article" : "on " + it.meta.split(" on ").pop().replace(/^Talk.*/, "the talk page")}</a>`}</div>
    <h3>${it.type === "about" ? "Also about me" : "Nearest neighbours"}</h3>
    ${nearList(near)}`;
  openPanel();
}
body.addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if (b) { clearQuery(); showItem(b.dataset.id); } });

/* filters and views */
let filter = "all";
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  $("#filters").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  field.querySelectorAll(".pt").forEach(p => p.classList.toggle("off", filter !== "all" && p.dataset.type !== filter));
  $("#listview").querySelectorAll("section").forEach(s => s.hidden = filter !== "all" && s.dataset.type !== filter);
});
function setView(v) {
  $("#views").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === v));
  $("#map").hidden = v !== "map"; $("#listview").hidden = v !== "list"; $("#legend").hidden = v !== "map";
}
$("#views").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });
if (innerWidth < 560) setView("list");

/* the agent (simulated) */
const stop = new Set("the a an and or of to in on for with what which who how why have has had you your do does did is are was were about tell me can i it that this any some built build made make work worked written write show".split(" "));
function search(q) {
  const toks = q.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(t => t.length > 2 && !stop.has(t));
  return items.map(d => ({ d, s: toks.reduce((n, t) => n + (d.title + " " + d.tags + " " + (d.stack || []).join(" ")).toLowerCase().split(new RegExp("\\b" + t.replace(/s$/, ""))).length - 1, 0) }))
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s || (a.d.type === "project" ? -1 : 1)).slice(0, 4).map(x => x.d);
}
function compose(hits) {
  if (!hits.length) return "I haven't published anything on that yet. The areas I work in most are agents, retrieval and evaluation, so try asking about one of those.";
  const me = hits.find(h => h.type === "about");
  if (me) return me.desc;
  const p = hits.find(h => h.type === "project"), a = hits.find(h => h.type === "article"), c = hits.find(h => h.type === "content");
  let out = p ? `The most relevant thing I've built is ${p.title}. ${p.desc}` : "I haven't shipped a project on exactly that, but I have covered it.";
  if (a) out += ` I wrote up the thinking in “${a.title}”.`;
  if (c) out += ` There's also a ${c.kind.toLowerCase()} on it: “${c.title}”.`;
  return out;
}
function clearQuery() {
  app.classList.remove("querying");
  wires.innerHTML = "";
  field.querySelectorAll(".lit").forEach(e => e.classList.remove("lit"));
  field.querySelector(".qnode")?.remove();
}
let run = 0;
async function ask(q) {
  q = q.trim(); if (!q) return;
  const me = ++run;
  clearQuery();
  field.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  setView("map");
  const hits = search(q);
  body.innerHTML = `<span class="mono">you asked</span><p class="q">${esc(q)}</p><ul class="trace"></ul><p class="ans"></p><div class="srcs"></div>`;
  openPanel();
  app.classList.add("querying");
  const trace = body.querySelector(".trace");
  const step = async (text) => {
    const li = document.createElement("li"); li.textContent = text; trace.append(li);
    await wait(430); li.classList.add("done");
  };
  await step("embedding your question");
  if (me !== run) return;
  if (hits.length) {
    const qx = hits.reduce((s, h) => s + h.x, 0) / hits.length + (hits.length === 1 ? 6 : 0);
    const qy = hits.reduce((s, h) => s + h.y, 0) / hits.length + (hits.length === 1 ? -8 : 0);
    const node = document.createElement("span"); node.className = "qnode"; node.style.left = qx + "%"; node.style.top = qy + "%"; field.append(node);
    await step(`found ${hits.length} nearby ${hits.length === 1 ? "item" : "items"}`);
    for (const h of hits) {
      if (me !== run) return;
      pt(h.id).classList.add("lit");
      wires.insertAdjacentHTML("beforeend", `<line x1="${qx}" y1="${qy}" x2="${h.x}" y2="${h.y}"/>`);
      await step(`reading ${typeName(h).toLowerCase()}: ${h.title}`);
    }
  } else {
    await step("nothing close enough to use");
  }
  if (me !== run) return;
  const out = body.querySelector(".ans");
  for (const w of compose(hits).split(" ")) { if (me !== run) return; out.textContent += (out.textContent ? " " : "") + w; await wait(24); }
  if (hits.length) body.querySelector(".srcs").innerHTML = `<h3>Sources</h3>${nearList(hits)}`;
}
$("#ask").addEventListener("submit", (e) => { e.preventDefault(); const i = $("#q"); ask(i.value); i.value = ""; });
["What have you built with agents?", "How do you approach evals?", "How can I reach you?"].forEach(s => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s;
  b.addEventListener("click", () => ask(s)); $("#hints").append(b);
});
</script>
</body>
